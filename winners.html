    <script>
      const yearsNavEl = document.getElementById('yearsNav');
      const libraryEl = document.getElementById('library');
      const debugStatusEl = document.getElementById('debugStatus');

      const { getSupabaseClient, escapeHtml, hasSupabaseConfig, SUPABASE_ANON_KEY } = window.__supabaseUtils;
      const SUPABASE_FUNCTIONS_URL = String(window.SUPABASE_FUNCTIONS_URL || '').trim();
      const TRACKABLE_SLIDE_HOSTS = new Set(['drive.google.com', 'docs.google.com']);
      // Sentinel row in winners_payload that holds the public AI/AECO Resources
      // content rather than a winners year. Kept off the real year range so any
      // calendar year stays available for actual winners.
      const RESOURCES_YEAR = 9999;
      // Display order for award categories within a year; unlisted ones follow.
      const CATEGORY_RANK = [
        'Top Winners',
        'Prize Winners',
        'AI Programme Winners',
        'Innovation Awards',
        'Merit Awards',
        'Merit Prizes',
        'Rising Innovator Awards'
      ];
      const YEAR_TITLES = {
        2026: '2026 AI (Hackathon) Challenge',
        2025: '2025 AI (Hackathon) Challenge',
        2024: '2024 AI (Hackathon) Programme'
      };
      let currentSession = null;

      function setStatus(text) {
        if (debugStatusEl) debugStatusEl.textContent = text || '';
      }

      function setStatusKvp({ api, source, years } = {}) {
        // Status display removed - silently ignore
      }

      function setDebug(text) {
        // Debug display removed - silently ignore
      }

      function isTrackableSlideUrl(url) {
        const value = String(url || '').trim();
        if (!value) return false;
        try {
          const parsed = new URL(value);
          return parsed.protocol === 'https:' && TRACKABLE_SLIDE_HOSTS.has(parsed.hostname.toLowerCase());
        } catch {
          return false;
        }
      }

      function makeSlideIdFromUrl(url, prefix = 'winners') {
        const value = String(url || '').trim();
        if (!value) return `${prefix}-unknown`;
        let seed = value;
        try {
          const parsed = new URL(value);
          seed = `${parsed.hostname}${parsed.pathname}`;
        } catch {
          // ignore and use raw value
        }
        const normalized = seed.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        return normalized ? `${prefix}-${normalized}`.slice(0, 120) : `${prefix}-unknown`;
      }

      function postSlideTrackingRedirect({ slideUrl, slideId, target = '_blank' }) {
        const functionsBase = String(window.SUPABASE_FUNCTIONS_URL || '').trim();
        const accessToken = String((currentSession && currentSession.access_token) || '').trim();
        const safeUrl = String(slideUrl || '').trim();
        const safeId = String(slideId || '').trim() || makeSlideIdFromUrl(safeUrl, 'winners');

        if (!functionsBase || !accessToken || !safeUrl) {
          return false;
        }

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = `${functionsBase}/slide-download-track`;
        form.target = target || '_blank';
        form.style.display = 'none';

        const addField = (name, value) => {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = name;
          input.value = value;
          form.appendChild(input);
        };

        addField('slide_id', safeId);
        addField('slide_url', safeUrl);
        addField('access_token', accessToken);

        document.body.appendChild(form);
        form.submit();
        setTimeout(() => form.remove(), 1200);
        return true;
      }

      function setupWinnersSlideTracking() {
        if (!libraryEl || libraryEl.dataset.slideTrackingBound === '1') return;
        libraryEl.dataset.slideTrackingBound = '1';

        libraryEl.addEventListener('click', (event) => {
          const targetEl = event && event.target ? event.target : null;
          if (!targetEl || !targetEl.closest) return;
          const anchor = targetEl.closest('a[href]');
          if (!anchor || !libraryEl.contains(anchor)) return;

          const href = String(anchor.getAttribute('href') || '').trim();
          if (!isTrackableSlideUrl(href)) return;

          const slideId = String(anchor.getAttribute('data-slide-id') || '').trim() || makeSlideIdFromUrl(href, 'winners');
          const didTrack = postSlideTrackingRedirect({
            slideUrl: href,
            slideId,
            target: String(anchor.getAttribute('target') || '_blank').trim() || '_blank'
          });

          if (didTrack) {
            event.preventDefault();
          }
        });
      }

      function renderYearsNav(years) {
        if (!years.length) {
          yearsNavEl.innerHTML = '';
          return;
        }
        yearsNavEl.innerHTML = years
          .map((y) => `<a class="pill" href="#year-${y}">${y}</a>`)
          .join('');
      }

      function renderLibrary(winners, challengeTopics) {        
        const years = (Array.isArray(winners) ? winners : [])
          .map((y) => Number(y.year))
          .filter((y) => Number.isFinite(y))
          .sort((a, b) => b - a);

        // Separate resources (sentinel year RESOURCES_YEAR) from real winners years
        const resourcesData = winners.find(w => Number(w.year) === RESOURCES_YEAR);
        const winnersYears = years.filter(y => y !== RESOURCES_YEAR);

        renderYearsNav(winnersYears);

        const byYear = new Map();
        for (const entry of Array.isArray(winners) ? winners : []) {
          const year = Number(entry.year);
          if (!Number.isFinite(year)) continue;
          byYear.set(year, entry);
        }

        const winnersHtml = winnersYears
          .map((year) => {
            const yearEntry = byYear.get(year) || {};
            const categories = Array.isArray(yearEntry.categories) ? yearEntry.categories : [];

            // Render challenge topics for this year if available
            let challengeHtml = '';
            if (challengeTopics && challengeTopics[year]) {
              const topics = Array.isArray(challengeTopics[year]) 
                ? challengeTopics[year] 
                : (Array.isArray(challengeTopics[year].challenge_topics) 
                    ? challengeTopics[year].challenge_topics 
                    : []);
              
              if (topics.length > 0) {
                const topicsHtml = topics.map((topic, idx) => {
                  const number = `${idx + 1}. `;
                  const code = topic.code ? `<span class="topic-code">${escapeHtml(topic.code)}</span>` : '';
                  const title = escapeHtml(topic.title || 'Challenge');
                  const desc = escapeHtml(topic.description || '');
                  return `
                    <div class="challenge-topic">
                      ${code ? `<div class="topic-label">${code}</div>` : ''}
                      <h4>${number}${title}</h4>
                      ${desc ? `<p class="muted small">${desc}</p>` : ''}
                    </div>
                  `;
                }).join('');

                challengeHtml = `
                  <details class="challenge-section">
                    <summary><strong>${year} Topic Survey Ranking</strong></summary>
                    <div class="challenge-topics-grid">
                      ${topicsHtml}
                    </div>
                  </details>
                `;
              }
            }

            // Helper function to render a category
            const renderCategory = (cat) => {
              if (!cat) return '';
              const title = escapeHtml(cat.category || 'Uncategorized');
              const useCases = Array.isArray(cat.useCases) ? cat.useCases : [];

              const cards = useCases
                .map((u) => {
                  const uTitle = escapeHtml(u.title);
                  const team = escapeHtml(u.team);
                  const award = escapeHtml(u.award);
                  const summary = escapeHtml(u.summary);
                  const links = Array.isArray(u.links) ? u.links : [];

                  const people = (u && typeof u === 'object' ? u.people : null) || {};
                  const leadData = people.lead;
                  const coLeads = Array.isArray(people.coLeads) ? people.coLeads : [];
                  const teamMembers = Array.isArray(people.teamMembers) ? people.teamMembers : [];

                  const peopleBits = [];
                  if (leadData) {
                    const lead = typeof leadData === 'string' ? { name: leadData } : leadData;
                    let leadHtml = `<div class="lead-member"><strong>Team Lead:</strong> ${escapeHtml(lead.name)}`;
                    if (lead.position && lead.company) {
                      leadHtml += `<br><span class="member-role">${escapeHtml(lead.position)}, ${escapeHtml(lead.company)}</span>`;
                    }
                    if (lead.linkedin) {
                      const linkedinUrl = lead.linkedin.startsWith('http') ? lead.linkedin : `https://${lead.linkedin}`;
                      leadHtml += ` <a href="${escapeHtml(linkedinUrl)}" target="_blank" rel="noreferrer" class="linkedin-link" aria-label="LinkedIn profile"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg></a>`;
                    }
                    leadHtml += `</div>`;
                    peopleBits.push(leadHtml);
                  }
                  if (coLeads.length) {
                    const coLeadsList = coLeads.map(cl => {
                      const coLead = typeof cl === 'string' ? { name: cl } : cl;
                      let html = escapeHtml(coLead.name);
                      if (coLead.position && coLead.company) {
                        html += ` <span class="member-role">(${escapeHtml(coLead.position)}, ${escapeHtml(coLead.company)})</span>`;
                      }
                      if (coLead.linkedin) {
                        const linkedinUrl = coLead.linkedin.startsWith('http') ? coLead.linkedin : `https://${coLead.linkedin}`;
                        html += ` <a href="${escapeHtml(linkedinUrl)}" target="_blank" rel="noreferrer" class="linkedin-link" aria-label="LinkedIn profile"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg></a>`;
                      }
                      return html;
                    }).join(', ');
                    peopleBits.push(`<div><strong>Co-leads:</strong> ${coLeadsList}</div>`);
                  }
                  if (teamMembers.length) peopleBits.push(`<div><strong>Team Members:</strong> ${escapeHtml(teamMembers.join(', '))}</div>`);

                  const peopleHtml = peopleBits.length
                    ? `<details class="usecase-details">
                        <summary>Project Team</summary>
                        <div class="usecase-people">${peopleBits.join('')}</div>
                      </details>`
                    : '';

                  const sc = u && typeof u === 'object' ? u.showcase || {} : {};
                  const showcaseSections = [
                    ['Problem', sc.problem],
                    ['Existing solutions', sc.existingSolutions],
                    ['Gap', sc.gap],
                    ['Proposed solution', sc.proposedSolution],
                    ['Approach', sc.approach],
                    ['Methods', sc.methods],
                    ['Tools', sc.tools],
                    ['Strategy', sc.strategy],
                    ['Impact', sc.impact]
                  ].filter((pair) => pair && String(pair[1] || '').trim().length);

                  const showcaseHtml = showcaseSections.length
                    ? `<details class="usecase-details">
                        <summary>Description</summary>
                        <dl class="usecase-dl">
                          ${showcaseSections
                            .map(([label, value]) => {
                              return `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd>`;
                            })
                            .join('')}
                        </dl>
                      </details>`
                    : '';

                  const linksHtml = links.length
                    ? `<details class="usecase-details">
                        <summary>Presentation</summary>
                        <div class="usecase-links">${links
                          .map((l) => {
                            const label = escapeHtml(l.label || l.url || 'Link');
                            const url = escapeHtml(l.url || '#');
                            return `<a href="${url}" target="_blank" rel="noreferrer">${label}</a>`;
                          })
                          .join(' · ')}</div>
                      </details>`
                    : '';

                  const awardHtml = award ? `<div class="usecase-award"><span class="award-icon">▸</span> <strong>${award}</strong></div>` : '';
                  const teamHtml = team ? `<div class="usecase-team small muted">${team}</div>` : '';

                  return `
                    <details class="usecase-card">
                      <summary class="usecase-summary">
                        <div class="usecase-header">
                          <h4 style="margin: 0; display: inline;">${uTitle}</h4>
                          ${awardHtml}
                          ${teamHtml}
                        </div>
                      </summary>
                      <div class="usecase-content">
                        ${summary ? `<p class="muted">${summary}</p>` : ''}
                        ${peopleHtml}
                        ${showcaseHtml}
                        ${linksHtml}
                      </div>
                    </details>
                  `;
                })
                .join('');

              return `
                <details class="category-section">
                  <summary><strong>${title}</strong></summary>
                  <div class="category-content">
                    ${cards || '<p class="small muted">No use cases listed yet.</p>'}
                  </div>
                </details>
              `;
            };

            // Render every category the year defines, top tier first.
            // 2024: Top Winners, Merit Prizes
            // 2025: Top Winners, Innovation Awards
            // 2026: Top Winners, Innovation Awards, Rising Innovator Awards
            // Anything not in CATEGORY_RANK keeps its payload order after the ranked ones.
            const rankOf = (cat) => {
              const idx = CATEGORY_RANK.indexOf(String((cat && cat.category) || ''));
              return idx === -1 ? CATEGORY_RANK.length : idx;
            };
            const orderedCategories = categories
              .map((cat, idx) => ({ cat, idx }))
              .sort((a, b) => (rankOf(a.cat) - rankOf(b.cat)) || (a.idx - b.idx))
              .map((entry) => entry.cat);

            // Use single-column layout for all years for consistency
            const columns = orderedCategories.map(renderCategory).join('');

            // Map year to full title
            const yearTitle = YEAR_TITLES[year] || String(year);

            return `
              <details class="year-section">
                <summary class="year-head">
                  <h2 style="display: inline; margin: 0;">${yearTitle}</h2>
                </summary>
                <div class="year-content">
                  ${challengeHtml}
                  <div class="single-column">${columns || '<p class="muted">No categories yet.</p>'}</div>
                </div>
              </details>
            `;
          })
          .join('');

        // Render resources section if data exists
        let resourcesHtml = '';
        if (resourcesData && Array.isArray(resourcesData.sections)) {
          const sectionsHtml = resourcesData.sections
            .map((section) => {
              const sectionTitle = escapeHtml(section.title || 'Resources');
              const categoriesHtml = (Array.isArray(section.categories) ? section.categories : [])
                .map((cat) => {
                  const categoryTitle = escapeHtml(cat.category || 'Category');
                  const itemsHtml = (Array.isArray(cat.items) ? cat.items : [])
                    .map((item) => {
                      const name = escapeHtml(item.name || 'Resource');
                      const url = escapeHtml(item.url || '#');
                      const desc = item.desc ? ` – ${escapeHtml(item.desc)}` : '';
                      const videoLink = item.video
                        ? ` (<a href="${escapeHtml(item.video)}" target="_blank" rel="noreferrer">video</a>)`
                        : '';
                      return `<li><a href="${url}" target="_blank" rel="noreferrer">${name}</a>${desc}${videoLink}</li>`;
                    })
                    .join('');
                  return `
                    <div class="resource-category">
                      <h4>${categoryTitle}</h4>
                      <ul>${itemsHtml || '<li class="muted">No items yet.</li>'}</ul>
                    </div>
                  `;
                })
                .join('');

              return `
                <details class="resource-section">
                  <summary class="resource-head" style="background: rgba(78, 162, 253, 0.1); padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 12px; border: 1px solid rgba(78, 162, 253, 0.2); transition: all 0.2s ease;" onmouseover="this.style.background='rgba(78, 162, 253, 0.15)'" onmouseout="this.style.background='rgba(78, 162, 253, 0.1)'">
                    <h3 style="display: inline; margin: 0;">${sectionTitle}</h3>
                  </summary>
                  <div class="resource-content" style="padding-left: 16px;">
                    ${categoriesHtml || '<p class="muted">No categories yet.</p>'}
                  </div>
                </details>
              `;
            })
            .join('');

          resourcesHtml = `
            <div class="resources-wrapper" style="margin-top: 40px; padding-top: 40px; border-top: 2px solid rgba(78, 162, 253, 0.2);">
              <h2 style="margin-bottom: 24px;">AI/AECO Resources</h2>
              ${sectionsHtml}
            </div>
          `;
        }

        libraryEl.innerHTML = winnersHtml + resourcesHtml;
      }

      async function loadWinners(session, retry = true, skipCache = false) {
        currentSession = session || null;
        if (!session || !session.access_token) {
          libraryEl.innerHTML = `
            <p><strong>Please sign in to view the winners library.</strong></p>
            <p class="muted">This page calls a protected Supabase Edge Function and requires a valid session.</p>
            <p><a class="btn primary" href="members.html">Go to sign-in</a></p>
          `;
          yearsNavEl.innerHTML = '';
          return;
        }

        const email = (session.user && session.user.email) ? String(session.user.email) : '';
        
        // Cache settings for continuous updates: 5 min fresh, show stale up to 1 hour
        // CACHE_VERSION is part of the key: bump it whenever the set of years or the
        // payload shape changes, otherwise members keep seeing a stale library for up
        // to an hour and a browser hard-refresh will not help (localStorage survives it).
        const CACHE_VERSION = '2026-08-01-pdf-slides';
        const CACHE_KEY = `winners_library_cache_${CACHE_VERSION}`;
        const CACHE_TIMESTAMP_KEY = `winners_library_timestamp_${CACHE_VERSION}`;

        // Drop caches written by any previous version so they don't accumulate.
        try {
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const key = localStorage.key(i);
            if (!key || !/^winners_library_(cache|timestamp)/.test(key)) continue;
            if (key !== CACHE_KEY && key !== CACHE_TIMESTAMP_KEY) localStorage.removeItem(key);
          }
        } catch (_e) {
          // localStorage unavailable (private mode / blocked) - nothing to clean up
        }
        const CACHE_FRESH_TIME = 300000; // 5 minutes
        const CACHE_MAX_AGE = 3600000; // 1 hour max
        
        let cacheShown = false;
        
        // Try to show cached data immediately if available and not skipping cache
        if (!skipCache) {
          try {
            const cachedData = localStorage.getItem(CACHE_KEY);
            const cachedTimestamp = localStorage.getItem(CACHE_TIMESTAMP_KEY);
            
            if (cachedData && cachedTimestamp) {
              const age = Date.now() - parseInt(cachedTimestamp, 10);
              
              // Show cache if less than 1 hour old
              if (age < CACHE_MAX_AGE) {
                const parsedCache = JSON.parse(cachedData);
                renderLibrary(parsedCache.winners, parsedCache.challengeTopics);
                
                const minutes = Math.floor(age / 60000);
                const timeAgo = minutes < 1 ? 'just now' : `${minutes} min ago`;
                yearsNavEl.innerHTML = `<small style="color: #666; font-size: 0.9em;">Last updated: ${timeAgo} <button id="refreshBtn" style="margin-left: 10px; padding: 4px 12px; font-size: 0.85em;" class="btn">Refresh</button></small>`;
                
                cacheShown = true;
                
                // If cache is fresh (< 5 min), we're done
                if (age < CACHE_FRESH_TIME) {
                  setupRefreshButton(session);
                  return;
                }
                // Otherwise continue to fetch fresh data in background
              }
            }
          } catch (cacheError) {
            console.warn('Cache read error:', cacheError);
          }
        }
        
        // Show loading indicator if no cache shown
        if (!cacheShown) {
          libraryEl.innerHTML = '<p style="text-align: center; padding: 40px; color: #666;">⏳ Loading winners library...</p>';
          yearsNavEl.innerHTML = '';
        }
        
        try {
          if (!SUPABASE_FUNCTIONS_URL) throw new Error('Missing SUPABASE_FUNCTIONS_URL (check supabase-config.js).');

          const res = await fetch(`${SUPABASE_FUNCTIONS_URL}/winners`, {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              authorization: `Bearer ${session.access_token}`
            }
          });

          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            if (res.status === 401 && retry && supabase) {
              try {
                const refreshed = await supabase.auth.refreshSession();
                const newSession = refreshed?.data?.session || null;
                if (newSession && newSession.access_token) {
                  return loadWinners(newSession, false);
                }
              } catch (_e) {
                // ignore refresh errors and continue with original handling
              }
            }
            if (res.status === 403) {
              libraryEl.innerHTML = `
                <p><strong>Signed in, but not registered yet.</strong></p>
                <p class="muted">Please submit the registration form using the same email address, then return here.</p>
                <p><a class="btn primary" href="https://forms.gle/rdZZzCxTVhAAzvCP7" target="_blank" rel="noreferrer">Open registration form</a></p>
              `;
            } else {
              libraryEl.textContent = data.error || 'Could not load winners library.';
            }
            return;
          }

          // Cache the successful response
          try {
            localStorage.setItem(CACHE_KEY, JSON.stringify({
              winners: data.winners,
              challengeTopics: data.challengeTopics
            }));
            localStorage.setItem(CACHE_TIMESTAMP_KEY, String(Date.now()));
          } catch (cacheError) {
            console.warn('Cache write error:', cacheError);
          }

          const years = (Array.isArray(data.winners) ? data.winners : [])
            .map((y) => Number(y.year))
            .filter((y) => Number.isFinite(y))
            .sort((a, b) => a - b);
          const yearsText = years.length ? years.join(', ') : 'none';
          const source = String(data.source || '').toLowerCase();

          renderLibrary(data.winners, data.challengeTopics);
          
          // Add refresh button with "just now" timestamp
          yearsNavEl.innerHTML = `<small style="color: #666; font-size: 0.9em;">Last updated: just now <button id="refreshBtn" style="margin-left: 10px; padding: 4px 12px; font-size: 0.85em;" class="btn">Refresh</button></small>`;
          setupRefreshButton(session);
        } catch (e) {
          libraryEl.textContent = String(e);
          yearsNavEl.innerHTML = '';
        }
      }
      
      function setupRefreshButton(session) {
        const btn = document.getElementById('refreshBtn');
        if (btn) {
          btn.onclick = () => {
            btn.disabled = true;
            btn.textContent = 'Refreshing...';
            loadWinners(session, true, true).finally(() => {
              // Button will be recreated by loadWinners
            });
          };
        }
      }

      async function init() {
        const { SUPABASE_URL } = window.__supabaseUtils;
        setDebug(
          `Functions URL: ${SUPABASE_FUNCTIONS_URL || '(missing)'} · Supabase URL: ${SUPABASE_URL || '(missing)'} · Client load error: ${
            window.__supabaseLoadError || 'none'
          }`
        );

        const supabase = await getSupabaseClient();
        if (!supabase) {
          return;
        }

        const { data } = await supabase.auth.getSession();
        currentSession = data && data.session ? data.session : null;
        setupWinnersSlideTracking();
        loadWinners(data && data.session ? data.session : null);

        supabase.auth.onAuthStateChange((_event, session) => {
          currentSession = session || null;
          loadWinners(session);
        });
      }

      init();
    </script>
  </body>
</html>
