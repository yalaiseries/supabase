<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resources · AI Hackathon</title>
    <meta name="description" content="Members-only resources (templates, recordings, links) stored in Supabase." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://www.aihackathon.pro/p/resources.html" />
    <meta name="theme-color" content="#0b1220" />

    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="../site.webmanifest" />
    <link rel="stylesheet" href="../site.css" />

    <script src="../supabase-config.js"></script>

    <script type="module">
      async function loadSupabase() {
        const urls = [
          'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm',
          'https://esm.sh/@supabase/supabase-js@2',
          'https://unpkg.com/@supabase/supabase-js@2/dist/esm/supabase.js'
        ];
        let lastError = '';
        for (const url of urls) {
          try {
            const mod = await import(url);
            if (mod && typeof mod.createClient === 'function') return { createClient: mod.createClient, url };
            lastError = `Loaded ${url} but createClient was not found.`;
          } catch (e) {
            lastError = String(e && e.message ? e.message : e);
          }
        }
        return { createClient: null, error: lastError || 'Failed to load Supabase client.' };
      }
      const loaded = await loadSupabase();
      if (loaded.createClient) {
        window.__createSupabaseClient = loaded.createClient;
        window.__supabaseClientSource = loaded.url;
        window.__supabaseLoadError = '';
      } else {
        window.__createSupabaseClient = null;
        window.__supabaseClientSource = '';
        window.__supabaseLoadError = loaded.error || 'Failed to load Supabase client.';
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="header">
      <div class="nav">
        <a class="brand" href="../index.html">
          <span class="badge" aria-hidden="true"></span>
          <span>
            <strong>AI Hackathon</strong>
            <span class="sub">Members resources</span>
          </span>
        </a>
        <nav class="links" aria-label="Primary">
          <a href="../index.html">Home</a>
          <a href="../members.html">Sign in</a>
          <a href="../winners.html" id="winnersLink" style="display:none;">Winners</a>
          <a class="btn primary" href="https://forms.gle/rdZZzCxTVhAAzvCP7" target="_blank" rel="noreferrer">Register</a>
        </nav>
      </div>
    </header>

    <script>
      (async function initMembersNav() {
        const winnersLink = document.getElementById('winnersLink');
        if (!winnersLink) return;

        const SUPABASE_URL = String(window.SUPABASE_URL || '').trim();
        const SUPABASE_ANON_KEY = String(window.SUPABASE_ANON_KEY || '').trim();
        if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.__createSupabaseClient) return;

        const supabase = window.__createSupabaseClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data } = await supabase.auth.getSession();
        winnersLink.style.display = data?.session?.user ? '' : 'none';
        supabase.auth.onAuthStateChange((_event, session) => {
          winnersLink.style.display = session?.user ? '' : 'none';
        });
      })();
    </script>

    <main class="main" id="main">
      <h1>Resources (Members-only)</h1>
      <p class="muted">Templates, recordings, internal links and useful references. Content is stored in Supabase and served via a protected Edge Function.</p>

      <section class="card">
        <h2>Status</h2>
        <div class="small" id="status" style="margin-top: 10px;"></div>
        <div class="small muted" id="debug" style="margin-top: 6px;"></div>
      </section>

      <section class="card" id="libraryCard">
        <h2>Library</h2>
        <div id="content" class="answer"></div>
      </section>

      <footer class="footer">
        <a href="mailto:youth@sia.org.sg">youth@sia.org.sg</a> · <a href="mailto:yal.aiseries@gmail.com">yal.aiseries@gmail.com</a>
      </footer>
    </main>

    <script>
      const statusEl = document.getElementById('status');
      const debugEl = document.getElementById('debug');
      const contentEl = document.getElementById('content');

      const SUPABASE_URL = String(window.SUPABASE_URL || '').trim();
      const SUPABASE_ANON_KEY = String(window.SUPABASE_ANON_KEY || '').trim();
      const SUPABASE_FUNCTIONS_URL = String(window.SUPABASE_FUNCTIONS_URL || '').trim();

      const hasSupabaseConfig = !!SUPABASE_URL && !!SUPABASE_ANON_KEY;
      let supabase = null;

      function setStatus(text) {
        if (statusEl) statusEl.textContent = text || '';
      }

      function setDebug(text) {
        if (debugEl) debugEl.textContent = text || '';
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      async function getSupabaseClient() {
        if (supabase) return supabase;
        if (!hasSupabaseConfig) return null;

        for (let i = 0; i < 40; i++) {
          if (window.__createSupabaseClient) break;
          await sleep(50);
        }
        if (!window.__createSupabaseClient) return null;

        try {
          supabase = window.__createSupabaseClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          return supabase;
        } catch {
          supabase = null;
          return null;
        }
      }

      function splitTopicTitle(title) {
        const t = String(title || '').trim();
        if (!t) return { topic: 'All', title: '' };
        const parts = t.split(' · ');
        if (parts.length >= 2) {
          const topic = parts.shift().trim() || 'All';
          return { topic, title: parts.join(' · ').trim() };
        }
        return { topic: 'All', title: t };
      }

      async function loadResources(session) {
        contentEl.textContent = '';

        setDebug(
          `Functions URL: ${SUPABASE_FUNCTIONS_URL || '(missing)'} · Supabase URL: ${SUPABASE_URL || '(missing)'} · Client load error: ${
            window.__supabaseLoadError || 'none'
          }`
        );

        if (!session || !session.access_token) {
          setStatus('Not signed in.');
          contentEl.innerHTML = `
            <p><strong>Please sign in to view resources.</strong></p>
            <p class="muted">This page calls a protected Supabase Edge Function and requires a valid session.</p>
            <p><a class="btn primary" href="../members.html">Go to sign-in</a></p>
          `;
          return;
        }

        const email = (session.user && session.user.email) ? String(session.user.email) : '';
        setStatus(`Signed in${email ? ` as ${email}` : ''}. Loading resources…`);

        try {
          if (!SUPABASE_FUNCTIONS_URL) throw new Error('Missing SUPABASE_FUNCTIONS_URL (check supabase-config.js).');

          const res = await fetch(`${SUPABASE_FUNCTIONS_URL}/members-resources`, {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              authorization: `Bearer ${session.access_token}`
            }
          });

          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            setStatus(`Resources API error: HTTP ${res.status}`);
            if (res.status === 403) {
              contentEl.innerHTML = `
                <p><strong>Signed in, but not registered yet.</strong></p>
                <p class="muted">Please submit the registration form using the same email address, then try again.</p>
                <p><a class="btn primary" href="https://forms.gle/rdZZzCxTVhAAzvCP7" target="_blank" rel="noreferrer">Open registration form</a></p>
              `;
            } else {
              contentEl.textContent = data.error || 'Could not load resources.';
            }
            return;
          }

          const items = Array.isArray(data.resources) ? data.resources : [];
          if (!items.length) {
            setStatus('Loaded resources: 0 items');
            contentEl.textContent = 'No members-only resources configured yet.';
            return;
          }

          const normalized = items
            .map((r) => {
              const rawTitle = String(r.title || '').trim();
              const rawUrl = String(r.url || '').trim();
              const rawNote = String(r.note || '').trim();
              const split = splitTopicTitle(rawTitle);
              return { topic: split.topic, title: split.title, url: rawUrl, note: rawNote };
            })
            .filter((r) => r.title && r.url);

          const byTopic = new Map();
          for (const r of normalized) {
            const arr = byTopic.get(r.topic) || [];
            arr.push(r);
            byTopic.set(r.topic, arr);
          }

          setStatus(`Loaded resources: ${normalized.length} items`);
          contentEl.innerHTML = Array.from(byTopic.entries())
            .sort((a, b) => String(a[0]).localeCompare(String(b[0])))
            .map(([topic, rows]) => {
              const itemsHtml = rows
                .map((r) => {
                  const title = escapeHtml(r.title);
                  const url = escapeHtml(r.url);
                  const note = escapeHtml(r.note || '');
                  const line = note ? `<div class="small">${note}</div>` : '';
                  return `<li><a href="${url}" target="_blank" rel="noreferrer">${title}</a>${line}</li>`;
                })
                .join('');

              return `
                <section style="margin: 12px 0;">
                  <h3 style="margin: 0 0 6px;">${escapeHtml(topic)}</h3>
                  <ul>${itemsHtml}</ul>
                </section>
              `;
            })
            .join('');
        } catch (e) {
          setStatus('');
          contentEl.textContent = String(e);
        }
      }

      async function init() {
        if (!hasSupabaseConfig) {
          setStatus('Admin setup required: missing SUPABASE_URL / SUPABASE_ANON_KEY in supabase-config.js');
          return;
        }

        supabase = await getSupabaseClient();
        if (!supabase) {
          setStatus('Supabase client failed to load (check network/CDN/config).');
          return;
        }

        const { data } = await supabase.auth.getSession();
        await loadResources(data && data.session ? data.session : null);

        supabase.auth.onAuthStateChange((_event, session) => {
          loadResources(session);
        });
      }

      init();
    </script>
  </body>
</html>
