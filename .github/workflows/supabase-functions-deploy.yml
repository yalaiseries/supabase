name: Deploy Supabase Edge Functions

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Uses the official Supabase CLI docker image to avoid installer issues.
      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: xcctqbamimafkkamuwly
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN GitHub secret"; exit 1;
          fi

          # Deploy Edge Functions using the official CLI container (no local install needed).
          for fn in register-sync members-resources winners chat; do
            echo "Deploying $fn..."
            docker run --rm \
              -e SUPABASE_ACCESS_TOKEN="$SUPABASE_ACCESS_TOKEN" \
              -v "$PWD:/work" \
              -w /work \
              supabase/cli:latest \
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done

      - name: Reminder: set Supabase secrets
        run: |
          echo "This workflow deploys code only. Configure function secrets in Supabase Dashboard (Project Settings -> Functions -> Secrets) or via CLI."