name: Deploy Supabase Edge Functions

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: xcctqbamimafkkamuwly
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN GitHub secret"; exit 1;
          fi

          for fn in register-sync members-resources winners chat; do
            echo "Deploying $fn..."
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done

      - name: Reminder: set Supabase secrets
        run: |
          echo "This workflow deploys code only. Configure function secrets in Supabase Dashboard (Project Settings -> Functions -> Secrets) or via CLI."