name: Deploy Supabase Edge Functions

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Supabase CLI version
        run: supabase --version

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: xcctqbamimafkkamuwly
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN GitHub secret"; exit 1;
          fi

          # Explicit non-interactive auth (keeps CLI behavior consistent across versions).
          supabase login --token "$SUPABASE_ACCESS_TOKEN" >/dev/null

          # Basic auth sanity check.
          supabase projects list >/dev/null

          for fn in register-sync register-reconcile members-resources winners chat; do
            echo "Deploying $fn..."
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done

          # Verify at least one deployed endpoint exists (404 means not deployed).
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://${PROJECT_REF}.functions.supabase.co/register-sync")
          echo "register-sync HTTP status: $code"
          if [ "$code" = "404" ]; then
            echo "register-sync is not deployed (still 404 NOT_FOUND)."; exit 1;
          fi

      - name: "Reminder: set Supabase secrets"
        run: echo "This workflow deploys code only. Configure function secrets in Supabase Dashboard (Project Settings > Functions > Secrets) or via CLI."
